services:
  postgres:
    image: postgres:16-alpine
    container_name: team-calendar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: team_calendar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: team-calendar-pb
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
    command:
      - --encryptionEnv=PB_ENCRYPTION_KEY
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-changeme-in-production}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team-calendar-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/team_calendar
      NEXT_PUBLIC_POCKETBASE_URL: http://pocketbase:8090
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      pocketbase:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  pocketbase_data:

